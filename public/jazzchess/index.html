<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Real Irish Jazz Chess Group · 2026</title>
  <style>
    :root {
      --bg:          #0b1520;
      --surface:     #132030;
      --surface2:    #1a2d40;
      --border:      #243548;
      --green:       #1c7a42;
      --green-light: #25a058;
      --gold:        #c9a535;
      --gold-light:  #e5bf55;
      --text:        #d8e8f8;
      --muted:       #6a8aa8;
      --win:         #2ea043;
      --loss:        #da3633;
      --draw:        #6e7f90;
      --radius:      14px;
      --radius-sm:   9px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      max-width: 500px;
      margin: 0 auto;
    }

    /* ── HEADER ─────────────────────────────────────────────────────── */
    header {
      background: linear-gradient(160deg, #071428 0%, #0d2a14 60%, #1a1a0a 100%);
      padding: 24px 16px 18px;
      text-align: center;
      border-bottom: 2px solid var(--gold);
      position: relative;
      overflow: hidden;
    }

    header::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        repeating-linear-gradient(
          45deg,
          rgba(201,165,53,0.03) 0px, rgba(201,165,53,0.03) 1px,
          transparent 1px, transparent 20px
        );
      pointer-events: none;
    }

    .header-piece {
      font-size: 3rem;
      line-height: 1;
      margin-bottom: 10px;
      filter: drop-shadow(0 0 12px rgba(201,165,53,0.5));
      position: relative;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--gold-light);
      letter-spacing: 0.5px;
      line-height: 1.2;
      position: relative;
    }

    .header-sub {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 5px;
      letter-spacing: 1px;
      text-transform: uppercase;
      position: relative;
    }

    /* ── TABS ────────────────────────────────────────────────────────── */
    .tabs {
      display: flex;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(0,0,0,0.4);
    }

    .tab-btn {
      flex: 1;
      padding: 13px 6px;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }

    .tab-btn.active {
      color: var(--gold-light);
      border-bottom-color: var(--gold);
    }

    /* ── CONTENT AREAS ───────────────────────────────────────────────── */
    .tab-content { display: none; padding: 16px 14px 80px; }
    .tab-content.active { display: block; }

    /* ── LOADING / ERROR ─────────────────────────────────────────────── */
    .loading, .error-msg {
      text-align: center;
      padding: 48px 20px;
      color: var(--muted);
    }

    .spinner {
      width: 34px; height: 34px;
      border: 3px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 14px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading p, .error-msg p { font-size: 0.85rem; }
    .error-msg small { color: var(--muted); font-size: 0.72rem; }

    /* ── SECTION HEADERS ─────────────────────────────────────────────── */
    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 20px 0 12px;
      cursor: pointer;
      user-select: none;
    }

    .section-header:first-child { margin-top: 0; }

    .section-title {
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: var(--gold);
      white-space: nowrap;
    }

    .section-line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .section-chevron {
      font-size: 0.65rem;
      color: var(--gold);
      flex-shrink: 0;
    }

    .section-body.collapsed { display: none; }

    /* ── WEEK BANNER ─────────────────────────────────────────────────── */
    .week-banner {
      text-align: center;
      padding: 10px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      margin-bottom: 16px;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .week-banner strong { color: var(--text); font-weight: 600; }

    .round-context-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .round-context {
      display: inline-block;
      background: rgba(201,165,53,0.12);
      color: var(--gold);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 0;
    }

    /* ── GAME CARDS ──────────────────────────────────────────────────── */
    .game-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 10px;
      position: relative;
      overflow: hidden;
    }

    .game-card.played  { border-left: 3px solid var(--green); }
    .game-card.pending { border-left: 3px solid var(--border); }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      margin-bottom: 9px;
    }

    .card-meta {
      font-size: 0.65rem;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      margin-bottom: 0;
    }

    .card-chevron {
      font-size: 0.65rem;
      color: var(--muted);
      flex-shrink: 0;
    }

    .card-summary {
      display: none;
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 2px;
      padding-bottom: 2px;
    }

    .game-card.collapsed .card-summary { display: block; }
    .game-card.collapsed .card-body    { display: none; }

    .matchup {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .player {
      flex: 1;
      font-size: 0.95rem;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .player.wp { text-align: left;  color: #f0ede8; }
    .player.bp { text-align: right; color: var(--text); }

    /* ── PLAYER LINKS ──────────────────────────────────────────────── */
    .player-link {
      cursor: pointer;
      text-decoration: underline;
      text-decoration-style: dotted;
      text-underline-offset: 2px;
    }

    .player-link:hover { color: var(--gold-light); }

    /* ── PLAYER PAGE ───────────────────────────────────────────────── */
    #player-page {
      display: none;
      padding-bottom: 60px;
    }

    #player-page.active { display: block; }

    .player-page-header {
      padding: 10px 14px;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .player-page-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    #playerBackBtn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 5px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 600;
      flex-shrink: 0;
    }

    #playerBackBtn:hover {
      color: var(--text);
      border-color: var(--gold);
    }

    .player-page-body {
      padding: 0 16px 40px;
    }

    .player-page-body .section-header {
      margin-top: 16px;
    }

    .vs {
      font-size: 0.6rem;
      color: var(--muted);
      background: var(--surface2);
      padding: 3px 8px;
      border-radius: 4px;
      flex-shrink: 0;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    /* Expected wins toggle */
    .toggle-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding: 10px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      user-select: none;
    }

    .toggle-row input[type="checkbox"] {
      width: 18px; height: 18px;
      accent-color: var(--gold);
      cursor: pointer;
      flex-shrink: 0;
    }

    .toggle-label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--muted);
    }

    /* Win probability bar — hidden by default, shown when toggle is on */
    .win-prob {
      margin-top: 10px;
      display: none;
    }

    #tab-schedule.probs-on .win-prob {
      display: block;
    }

    .prob-track {
      height: 5px;
      background: var(--surface2);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 5px;
      display: flex;
    }

    .prob-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--gold), var(--green-light));
      border-radius: 3px;
    }

    .win-prob.black-favoured .prob-fill {
      margin-left: auto;
      background: linear-gradient(270deg, var(--gold), var(--green-light));
    }

    .prob-text {
      font-size: 0.7rem;
      text-align: center;
      color: var(--muted);
    }

    .prob-text strong { color: var(--gold-light); }

    /* Result pill */
    .result-row {
      text-align: center;
      margin-top: 10px;
    }

    /* Lichess link + board embed */
    .lichess-footer {
      margin-top: 12px;
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }

    .lichess-link-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .lichess-link {
      font-size: 0.72rem;
      color: var(--muted);
      text-decoration: none;
      letter-spacing: 0.3px;
    }

    .lichess-link:hover { color: var(--gold); }

    .lichess-board-toggle {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.72rem;
      cursor: pointer;
      padding: 0;
      letter-spacing: 0.3px;
    }

    .lichess-board-toggle:hover { color: var(--gold); }

    .lichess-embed {
      margin-top: 10px;
      border-radius: 6px;
      overflow: hidden;
    }

    .lichess-embed iframe {
      display: block;
    }

    .pill {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .pill.w-win  { background: rgba(46,160,67,0.18);  color: #4caf50; }
    .pill.b-win  { background: rgba(218,54,51,0.18);  color: #ef5350; }
    .pill.draw   { background: rgba(110,127,144,0.18); color: #9aa5b4; }
    .pill.pend   { background: var(--surface2); color: var(--muted); }

    /* Bye */
    .bye-note {
      font-size: 0.7rem;
      color: var(--muted);
      font-style: italic;
    }

    /* No games */
    .no-games {
      text-align: center;
      padding: 28px 16px;
      color: var(--muted);
      font-size: 0.85rem;
    }

    /* ── STATS TAB ───────────────────────────────────────────────────── */
    .standings-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 12px;
    }

    .standings-head {
      padding: 10px 14px;
      background: var(--surface2);
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--gold);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
    }

    .standings-body.collapsed { display: none; }

    /* ── AWARD CARDS ─────────────────────────────────────────────────── */
    .award-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .award-icon { font-size: 1.8rem; flex-shrink: 0; line-height: 1; }

    .award-title {
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 3px;
    }

    .award-winner {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--text);
    }

    .award-stat {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 3px;
      line-height: 1.4;
    }

    .standing-row {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
      gap: 8px;
    }

    .standing-row:last-child { border-bottom: none; }

    .pos {
      width: 22px;
      text-align: center;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
    }

    .pos.gold   { color: #f0c030; }
    .pos.silver { color: #c0c8d0; }
    .pos.bronze { color: #c08050; }

    .s-name { flex: 1; font-weight: 600; }

    .s-played {
      font-size: 0.72rem;
      color: var(--muted);
      width: 28px;
      text-align: right;
    }

    .s-pts {
      font-weight: 800;
      color: var(--gold-light);
      width: 32px;
      text-align: right;
    }

    /* ── DATA TABLE ──────────────────────────────────────────────────── */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }

    .data-table thead {
      background: var(--surface2);
      border-bottom: 2px solid var(--border);
    }

    .data-table th {
      padding: 10px 10px;
      text-align: left;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--gold);
      font-size: 0.7rem;
      text-transform: uppercase;
      border-right: 1px solid var(--border);
    }

    .data-table th:last-child { border-right: none; }

    .data-table tbody tr {
      border-bottom: 1px solid var(--border);
    }

    .data-table tbody tr:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    .data-table td {
      padding: 10px;
      color: var(--text);
    }

    .data-table .col-player {
      font-weight: 600;
      color: #f0ede8;
    }

    .data-table .col-num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .table-section-header {
      padding: 16px 14px 8px;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--gold);
      margin-top: 8px;
    }

    .table-section-header:first-of-type {
      margin-top: 0;
    }

    /* ── CROSSTABLE ──────────────────────────────────────────────────── */
    .crosstable-wrap {
      overflow-x: auto;
      margin-bottom: 16px;
      -webkit-overflow-scrolling: touch;
    }

    .crosstable {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.75rem;
    }

    .crosstable thead {
      background: var(--surface2);
      border-bottom: 2px solid var(--border);
    }

    .crosstable th {
      padding: 8px 5px;
      text-align: center;
      font-weight: 800;
      color: var(--gold);
      font-size: 0.65rem;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      border-right: 1px solid var(--border);
      white-space: nowrap;
    }

    .crosstable th.ct-player { text-align: left; padding-left: 10px; }
    .crosstable th:last-child { border-right: none; }

    .crosstable tbody tr {
      border-bottom: 1px solid var(--border);
    }

    .crosstable tbody tr:last-child { border-bottom: none; }

    .crosstable td {
      padding: 8px 5px;
      text-align: center;
      border-right: 1px solid var(--border);
      font-variant-numeric: tabular-nums;
    }

    .crosstable td:last-child { border-right: none; }

    .ct-pos-cell {
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--muted);
      width: 22px;
    }

    .ct-pos-cell.gold   { color: #f0c030; }
    .ct-pos-cell.silver { color: #c0c8d0; }
    .ct-pos-cell.bronze { color: #c08050; }

    .ct-player-cell {
      text-align: left;
      padding-left: 10px;
      font-weight: 600;
      color: #f0ede8;
      max-width: 100px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ct-pts-cell {
      font-weight: 800;
      color: var(--gold-light);
      width: 28px;
    }

    .ct-cell {
      width: 28px;
      font-weight: 700;
      font-size: 0.78rem;
    }

    .ct-cell.ct-win  {
      background: rgba(28, 122, 66, 0.25);
      color: #4caf50;
    }

    .ct-cell.ct-loss {
      background: rgba(218, 54, 51, 0.18);
      color: #ef5350;
    }

    .ct-cell.ct-draw {
      background: var(--surface2);
      color: var(--muted);
    }

    .ct-cell.ct-diag {
      background: rgba(0, 0, 0, 0.35);
      color: var(--border);
    }

    .ct-cell.ct-none {
      color: var(--border);
    }

    /* Player selector */
    .select-wrap {
      position: relative;
      margin-bottom: 16px;
    }

    select {
      width: 100%;
      padding: 13px 40px 13px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 0.95rem;
      appearance: none;
      cursor: pointer;
    }

    select:focus { outline: 2px solid var(--gold); outline-offset: 2px; }

    .select-arrow {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--muted);
    }

    /* Player detail card */
    .player-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .player-card-head {
      background: linear-gradient(135deg, #0d2a14 0%, #132030 100%);
      padding: 16px 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid var(--border);
    }

    .avatar {
      width: 48px; height: 48px;
      background: linear-gradient(135deg, var(--green), var(--gold));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      flex-shrink: 0;
    }

    .avatar-img {
      border-radius: 50%;
      object-fit: cover;
      display: block;
      flex-shrink: 0;
    }

    .p-name  { font-size: 1.1rem; font-weight: 800; }
    .p-league { font-size: 0.72rem; color: var(--muted); margin-top: 3px; }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--border);
    }

    .stat-box {
      background: var(--surface);
      padding: 14px 8px;
      text-align: center;
    }

    .stat-val {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--gold-light);
      line-height: 1;
    }

    .stat-lbl {
      font-size: 0.6rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-top: 4px;
    }

    /* WDL bar */
    .wdl-section { padding: 14px; border-bottom: 1px solid var(--border); }

    .wdl-bar {
      display: flex;
      height: 7px;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 7px;
    }

    .wdl-w { background: var(--win);  }
    .wdl-d { background: var(--draw); }
    .wdl-l { background: var(--loss); }

    .wdl-legend {
      display: flex;
      justify-content: center;
      gap: 14px;
      font-size: 0.72rem;
      color: var(--muted);
    }

    .dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      margin-right: 4px;
      vertical-align: middle;
    }

    /* Stat rows */
    .stat-rows { padding: 4px 0; }

    .srow {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 0.84rem;
    }

    .srow:last-child { border-bottom: none; }
    .srow-lbl { color: var(--muted); }
    .srow-val { font-weight: 700; }

    /* Form dots */
    .form-dots {
      display: flex;
      gap: 5px;
    }

    .fd {
      width: 11px; height: 11px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .fd.W { background: var(--win);  }
    .fd.D { background: var(--draw); }
    .fd.L { background: var(--loss); }
    .fd._ { background: var(--border); }

    /* ── PAST ROUNDS TAB ────────────────────────────────────────────────── */
    .hist-round {
      margin-bottom: 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }

    .hist-round-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: var(--surface2);
      cursor: pointer;
      user-select: none;
    }

    .hist-round-header:hover { background: #1f3a52; }

    .hist-round-title {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--gold-light);
      letter-spacing: 0.3px;
    }

    .hist-round-meta {
      font-size: 0.68rem;
      color: var(--muted);
      margin-left: 8px;
      font-weight: 400;
    }

    .hist-round-chevron {
      font-size: 0.65rem;
      color: var(--gold);
      flex-shrink: 0;
    }

    .hist-round-body { background: var(--surface); }
    .hist-round-body.collapsed { display: none; }

    .hist-league-label {
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: var(--gold);
      padding: 8px 14px 4px;
      border-top: 1px solid var(--border);
    }

    .hist-league-label:first-child { border-top: none; padding-top: 10px; }

    .hist-game-row {
      border-top: 1px solid var(--border);
      cursor: pointer;
    }

    .hist-game-row.no-expand { cursor: default; }

    .hist-game-row:first-of-type { border-top: none; }

    .hist-game-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
    }

    .hist-game-summary:hover { background: rgba(255,255,255,0.03); }

    .hist-game-players {
      font-size: 0.83rem;
      font-weight: 600;
      color: var(--text);
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-right: 10px;
    }

    .hist-game-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .hist-game-chevron {
      font-size: 0.65rem;
      color: var(--muted);
      flex-shrink: 0;
    }

    .hist-game-detail {
      padding: 10px 14px 14px;
      border-top: 1px solid var(--border);
      background: rgba(0,0,0,0.15);
    }

    .hist-game-detail.hidden { display: none; }

    /* ── SCOREBOARD ROW (game cards, cup) ──────────────────────────── */
    .scoreboard-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
    }

    .sb-player {
      flex: 1;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 8px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .sb-player span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sb-white { justify-content: flex-start; }
    .sb-black { justify-content: flex-end; flex-direction: row-reverse; }

    .sb-winner {
      background: rgba(201, 165, 53, 0.1);
    }

    .sb-winner .player-link { color: var(--gold-light); }

    .sb-score {
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--text);
      white-space: nowrap;
      flex-shrink: 0;
      letter-spacing: 0.5px;
    }

    .sb-pending {
      color: var(--muted);
      font-weight: 600;
      font-size: 0.72rem;
      letter-spacing: 0;
    }

    /* ── HISTORY ROW SCOREBOARD ────────────────────────────────────── */
    .hg-scoreboard {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }

    .hg-name {
      flex: 1;
      font-size: 0.83rem;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
    }

    .hg-name.hg-winner {
      color: var(--text);
      font-weight: 700;
    }

    .hg-name.hg-winner .player-link { color: var(--text); }

    .hg-left  { text-align: left; }
    .hg-right { text-align: right; }

    .hg-score {
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 800;
      color: var(--text);
      white-space: nowrap;
      flex-shrink: 0;
      letter-spacing: 0.5px;
    }

    .hg-pending { color: var(--muted); font-weight: 600; }

    .hist-lichess-row {
      margin-top: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    /* ── CUP TAB ─────────────────────────────────────────────────────── */
    .cup-note {
      font-size: 0.78rem;
      color: var(--muted);
      text-align: center;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .cup-round-label {
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--gold);
      margin: 18px 0 8px;
    }

    .cup-round-label:first-of-type { margin-top: 0; }

    .cup-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 13px 14px;
      margin-bottom: 8px;
    }

    /* ── FOOTER ──────────────────────────────────────────────────────── */
    footer {
      text-align: center;
      padding: 16px 14px 24px;
      border-top: 1px solid var(--border);
      margin-top: 8px;
    }

    footer a {
      color: var(--gold);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
    }

    footer a:hover { text-decoration: underline; }

    .refresh-note {
      font-size: 0.68rem;
      color: var(--muted);
      margin-top: 6px;
    }

    /* Desktop border */
    @media (min-width: 520px) {
      body {
        border-left:  1px solid var(--border);
        border-right: 1px solid var(--border);
        min-height: 100vh;
      }
    }
  </style>
</head>

// Get avatar HTML for a player (image or fallback chess piece)
function getAvatar(playerName, size = '40px') {
  // Case-insensitive lookup so sheet names don't need to match exactly
  const key = Object.keys(playerImages).find(k => k.toLowerCase() === (playerName || '').toLowerCase());
  const imgUrl = key ? playerImages[key] : null;
  if (imgUrl) {
    return `<div class="avatar" style="width:${size};height:${size};background:transparent;padding:0"><img class="avatar-img" src="${imgUrl}" alt="${playerName}" style="width:${size};height:${size}"></div>`;
  }
  // Fallback: chess piece with gradient background
  return `<div class="avatar" style="width:${size};height:${size}">&#x265f;</div>`;
}

// ── JSONP FETCH via Google Visualization API ──────────────────────────────────
// Uses <script> injection instead of fetch(), so it works when opened directly
// as a local file (file:// URLs block cross-origin fetch requests).
function fetchSheet(sheetName, nheaders = 0) {
  return new Promise((resolve, reject) => {
    const cb  = 'gviz_' + Math.random().toString(36).slice(2);
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq`
              + `?tqx=responseHandler:${cb}&headers=${nheaders}`
              + `&sheet=${encodeURIComponent(sheetName)}`;

    const timer = setTimeout(() => {
      cleanup(); reject(new Error(`Timeout loading "${sheetName}"`));
    }, 15000);

    function cleanup() {
      clearTimeout(timer);
      delete window[cb];
      if (script.parentNode) script.remove();
    }

    window[cb] = data => {
      cleanup();
      if (!data || !data.table) { reject(new Error(`No data in "${sheetName}"`)); return; }
      resolve(gvizToRows(data.table, nheaders));
    };

    const script = document.createElement('script');
    script.src = url;
    script.onerror = () => { cleanup(); reject(new Error(`Could not load "${sheetName}"`)); };
    document.head.appendChild(script);
  });
}

// Convert gviz table → array of string arrays.
// When nheaders=1, gviz extracts row 1 as column metadata (table.cols), bypassing
// the type-coercion bug where numeric column headers like "White Rating" return null
// as data cells. We prepend those labels as rows[0] so the rest of the parsing is unchanged.
function gvizToRows(table, nheaders = 0) {
  const dataRows = (table.rows || []).map(row => {
    if (!row || !row.c) return [];
    return row.c.map(cell => {
      if (!cell || cell.v === null || cell.v === undefined) return '';
      if (cell.f !== undefined && cell.f !== null) return String(cell.f);
      return String(cell.v);
    });
  });
  if (nheaders > 0) {
    // table.cols carries the true header labels — immune to column type coercion
    const labels = (table.cols || []).map(c => (c.label || '').trim());
    return [labels, ...dataRows];
  }
  return dataRows;
}

function toObjects(rows, headerRow = 0) {
  const hdrs = rows[headerRow].map(h => h.trim());
  return rows.slice(headerRow + 1)
    .filter(r => r.some(c => c.trim()))
    .map(r => Object.fromEntries(hdrs.map((h, i) => [h, (r[i] || '').trim()])));
}

// ── DATE HELPERS ──────────────────────────────────────────────────────────────
function parseDate(s) {
  if (!s) return null;
  // DD/MM/YYYY
  let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) return new Date(+m[3], +m[2]-1, +m[1]);
  // YYYY-MM-DD
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (m) return new Date(+m[1], +m[2]-1, +m[3]);
  const d = new Date(s);
  return isNaN(d) ? null : d;
}

function weekBounds(now = new Date()) {
  const d   = new Date(now);
  const day = d.getDay(); // 0 = Sun
  d.setDate(d.getDate() - (day === 0 ? 6 : day - 1)); // Monday
  d.setHours(0, 0, 0, 0);
  const monday = new Date(d);
  const sunday = new Date(d);
  sunday.setDate(d.getDate() + 6);
  sunday.setHours(23, 59, 59, 999);
  return { monday, sunday };
}

function fmtDateRange(monday, sunday) {
  const o = { day: 'numeric', month: 'short' };
  return `${monday.toLocaleDateString('en-IE', o)} – ${sunday.toLocaleDateString('en-IE', o)}`;
}

function fmtDate(d) {
  if (!d) return '';
  return d.toLocaleDateString('en-IE', { weekday: 'short', day: 'numeric', month: 'short' });
}

// ── ELO ───────────────────────────────────────────────────────────────────────
function eloProb(wR, bR) {
  if (!wR || !bR) return null;
  return 1 / (1 + Math.pow(10, (bR - wR) / 400));
}

// ── LOAD ALL SHEETS ───────────────────────────────────────────────────────────
async function loadAll() {
  const [sA, sB, res, ps, cup] = await Promise.all([
    fetchSheet('League A Schedule'),
    fetchSheet('League B Schedule'),
    fetchSheet('Results',      1),   // headers=1: row 1 is column headers (no title row)
    fetchSheet('Player Stats', 1),   // headers=1: row 1 is column headers (League|Player|Elo)
    fetchSheet('Louis Stewart Cup'),
  ]);
  return { sA, sB, res, ps, cup };
}

// ── PARSE SCHEDULE ────────────────────────────────────────────────────────────
function parseSchedule(rows) {
  // Don't rely on fixed row offsets — gviz may or may not include the title row.
  // Instead, identify game rows by checking that columns C and E contain
  // player-name-like values (non-empty, not header labels).
  const games = [];
  let round = null;
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i];
    if (!r || r.length === 0) continue;
    const white = (r[COL_WHITE] || '').trim();
    const black = (r[COL_BLACK] || '').trim();
    // Skip empty rows, the title row, and header rows
    if (!white || !black) continue;
    if (/player|white|black|schedule/i.test(white)) continue;
    // If this row has a numeric round number, update current round
    const rn = (r[COL_ROUND] || '').trim();
    if (rn && /^\d+(\.\d+)?$/.test(rn)) round = Math.round(parseFloat(rn));
    games.push({
      round,
      white,
      black,
      bye:      (r[COL_BYE]      || '').trim() || null,
      expected: (r[COL_EXPECTED] || '').trim() || null,
      date:     parseDate((r[COL_DATE] || '').trim()),
    });
  }
  return games;
}

// ── PARSE RESULTS ─────────────────────────────────────────────────────────────
function parseResults(rows) {
  // With headers=1, gvizToRows prepends col labels as rows[0]; data starts at rows[1].
  // All 30 Lichess columns (White Rating, White Blunders, White Think, etc.) now resolve correctly.
  const hdrs = rows[0].map(h => h.trim());
  const map  = {};
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    if (!r || r.every(c => !c)) continue;
    const obj = Object.fromEntries(hdrs.map((h, j) => [h, (r[j]||'').trim()]));
    const w = obj.White, b = obj.Black, res = obj.Result;
    if (!w || !b || !res) continue;
    // Column C (index 2) holds the Lichess game URL
    obj.GameURL = (r[2]||'').trim();
    const key = [w,b].map(x=>x.toLowerCase()).sort().join('|');
    (map[key] = map[key] || []).push(obj);
  }
  return map;
}

function lookupResult(map, white, black, strict = true) {
  const key = [white,black].map(x=>x.toLowerCase()).sort().join('|');
  const arr = map[key] || [];
  // In strict mode, only return a result where white/black align with the schedule
  const aligned = arr.find(m => m.White.toLowerCase() === white.toLowerCase() && m.Black.toLowerCase() === black.toLowerCase());
  if (aligned) return aligned;
  // In loose mode (e.g. cup), fall back to any result for this pair
  if (!strict) return arr[arr.length-1] || null;
  return null;
}

// ── PARSE PLAYER STATS ────────────────────────────────────────────────────────
function parsePlayerStats(rows) {
  // With headers=1, gvizToRows prepends col labels as rows[0]; data starts at rows[1].
  // Player Stats tab is now a simple registry: League | Player | Elo (no title row).
  const hdrs = (rows[0] || []).map(h => h.trim());
  const map  = {};
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    if (!r || r.every(c => !c)) continue;
    const obj = {};
    hdrs.forEach((h, j) => { if (h && !(h in obj)) obj[h] = (r[j]||'').trim(); });
    const name = obj.Player;
    if (name) map[name.toLowerCase()] = obj;
  }
  return map;
}

function getRating(statsMap, name) {
  const p = statsMap[name.toLowerCase()];
  if (!p) return null;
  // With headers=1 the 'Elo' column name is now correctly resolved.
  // Also accept 'Rating', 'Rapid Rating' etc. as fallbacks.
  const keys = Object.keys(p);
  const rKey = keys.find(k => /^(elo|rating|rapid\s*rating)$/i.test(k));
  if (rKey) return parseFloat(p[rKey]) || null;
  // Last resort: third column value (League=0, Player=1, Elo=2)
  const vals = Object.values(p);
  return parseFloat(vals[2]) || null;
}

// ── RECENT FORM ───────────────────────────────────────────────────────────────
function recentForm(name, resultsMap) {
  const lc  = name.toLowerCase();
  const all = [];
  for (const matches of Object.values(resultsMap)) {
    for (const m of matches) {
      const isW = m.White.toLowerCase() === lc;
      const isB = m.Black.toLowerCase() === lc;
      if (!isW && !isB) continue;
      let outcome;
      if      (m.Result === '1-0') outcome = isW ? 'W' : 'L';
      else if (m.Result === '0-1') outcome = isW ? 'L' : 'W';
      else outcome = 'D';
      all.push({ date: parseDate(m.Date), outcome });
    }
  }
  all.sort((a,b) => (b.date||0) - (a.date||0));
  return all.slice(0, 5).map(x => x.outcome);
}

// ── ENRICH STATS FROM RESULTS ─────────────────────────────────────────────────
// The Player Stats sheet formulas can return null/0 through the gviz API.
// This function recomputes all numeric stats (games, wins, draws, losses, points,
// accuracy, ACPL, blunders, mistakes) directly from the Results data, which is
// always reliably loaded.
function enrichStatsWithResults(statsMap, resultsMap) {
  const acc = {};
  for (const name of Object.keys(statsMap)) {
    acc[name] = { games:0, wins:0, draws:0, losses:0,
                  accSum:0, accN:0, acplSum:0, acplN:0,
                  blunderSum:0, blunderN:0, mistakeSum:0, mistakeN:0,
                  wThinkSum:0, wMovesSum:0, bThinkSum:0, bMovesSum:0 };
  }

  for (const games of Object.values(resultsMap)) {
    for (const g of games) {
      const wLc = (g.White || '').toLowerCase();
      const bLc = (g.Black || '').toLowerCase();
      const res  = g.Result;
      const lg   = g.League;

      // White player
      if (acc[wLc] && statsMap[wLc] && statsMap[wLc].League === lg) {
        const a = acc[wLc];
        a.games++;
        if (res === '1-0')      a.wins++;
        else if (res === '0-1') a.losses++;
        else                    a.draws++;
        const wa = parseFloat(g['White Accuracy']); if (!isNaN(wa)) { a.accSum += wa;  a.accN++;  }
        const wc = parseFloat(g['White ACPL']);      if (!isNaN(wc)) { a.acplSum += wc; a.acplN++; }
        const wb = parseFloat(g['White Blunders']);  if (!isNaN(wb)) { a.blunderSum += wb; a.blunderN++; }
        const wm = parseFloat(g['White Mistakes']);  if (!isNaN(wm)) { a.mistakeSum += wm; a.mistakeN++; }
        const wt = parseFloat(g['White Think']); const mv = parseFloat(g['Moves']);
        if (!isNaN(wt) && !isNaN(mv) && mv > 0) { a.wThinkSum += wt; a.wMovesSum += Math.ceil(mv / 2); }
      }

      // Black player
      if (acc[bLc] && statsMap[bLc] && statsMap[bLc].League === lg) {
        const a = acc[bLc];
        a.games++;
        if (res === '0-1')      a.wins++;
        else if (res === '1-0') a.losses++;
        else                    a.draws++;
        const ba = parseFloat(g['Black Accuracy']); if (!isNaN(ba)) { a.accSum += ba;  a.accN++;  }
        const bc = parseFloat(g['Black ACPL']);      if (!isNaN(bc)) { a.acplSum += bc; a.acplN++; }
        const bb = parseFloat(g['Black Blunders']);  if (!isNaN(bb)) { a.blunderSum += bb; a.blunderN++; }
        const bm = parseFloat(g['Black Mistakes']);  if (!isNaN(bm)) { a.mistakeSum += bm; a.mistakeN++; }
        const bt = parseFloat(g['Black Think']); const bmv = parseFloat(g['Moves']);
        if (!isNaN(bt) && !isNaN(bmv) && bmv > 0) { a.bThinkSum += bt; a.bMovesSum += Math.floor(bmv / 2); }
      }
    }
  }

  for (const [name, a] of Object.entries(acc)) {
    const p = statsMap[name];
    if (!p || a.games === 0) continue;
    p.Games   = String(a.games);
    p.Wins    = String(a.wins);
    p.Draws   = String(a.draws);
    p.Losses  = String(a.losses);
    p.Points  = String(a.wins + a.draws * 0.5);
    // Only overwrite Player Stats values when Results actually provided the source data.
    // If Results lacks a column (e.g. no White Blunders, no White Think), leave the
    // correctly-computed gviz value from the Player Stats sheet untouched.
    if (a.accN)      { p['Avg Accuracy']     = String(a.accSum  / a.accN);  }
    if (a.acplN)     { p['Avg ACPL']         = String(a.acplSum / a.acplN);
                       p['Avg ACPL (White)'] = p['Avg ACPL'];               }
    if (a.blunderN)  { p['Avg Blunders']     = String(a.blunderSum / a.blunderN); }
    if (a.mistakeN)  { p['Avg Mistakes']     = String(a.mistakeSum / a.mistakeN); }
    if (a.wMovesSum) { p['Avg Think/Move (W)'] = String(a.wThinkSum / a.wMovesSum); }
    if (a.bMovesSum) { p['Avg Think/Move (B)'] = String(a.bThinkSum / a.bMovesSum); }
  }
}

// ── RENDER HELPERS ────────────────────────────────────────────────────────────
function resultPill(game, result) {
  if (!result) return `<div class="result-row"><span class="pill pend">Pending</span></div>`;
  const r = result.Result;
  if (r === '1-0') return `<div class="result-row"><span class="pill w-win">${game.white} wins · 1–0</span></div>`;
  if (r === '0-1') return `<div class="result-row"><span class="pill b-win">${game.black} wins · 0–1</span></div>`;
  return `<div class="result-row"><span class="pill draw">Draw · ½–½</span></div>`;
}

function probBar(prob, wName, bName, expectedStr) {
  // Prefer the pre-computed expected result from column H of the schedule sheet
  if (expectedStr) {
    // Format is e.g. "53% — B4dBish0p" or "53% - B4dBish0p"
    const m = expectedStr.match(/^(\d+(?:\.\d+)?)%?\s*[—–\-]\s*(.+)$/);
    if (m) {
      const pct      = Math.round(parseFloat(m[1]));
      const favoured = m[2].trim();
      const blackFav = favoured.toLowerCase() === bName.toLowerCase();
      return `
        <div class="win-prob${blackFav ? ' black-favoured' : ''}">
          <div class="prob-track"><div class="prob-fill" style="width:${pct}%"></div></div>
          <div class="prob-text"><strong>${pct}%</strong> ${favoured}</div>
        </div>`;
    }
  }
  // Fall back to Elo-computed probability if available
  if (prob === null) return '';
  const pct      = Math.round(prob * 100);
  const blackFav = pct < 50;
  const favoured = blackFav ? bName : wName;
  const disp     = blackFav ? 100 - pct : pct;
  return `
    <div class="win-prob${blackFav ? ' black-favoured' : ''}">
      <div class="prob-track"><div class="prob-fill" style="width:${disp}%"></div></div>
      <div class="prob-text"><strong>${disp}%</strong> ${favoured}</div>
    </div>`;
}

function cardSummary(g, result) {
  if (!result) return `${g.white} vs ${g.black}`;
  const r = result.Result;
  const score = r === '1-0' ? '1–0' : r === '0-1' ? '0–1' : '½–½';
  return `${g.white}  ${score}  ${g.black}`;
}

function scoreboardRow(g, result) {
  let scoreText = 'vs';
  let winner    = null; // 'white' | 'black' | 'draw'
  if (result) {
    if      (result.Result === '1-0') { scoreText = '1 – 0'; winner = 'white'; }
    else if (result.Result === '0-1') { scoreText = '0 – 1'; winner = 'black'; }
    else                              { scoreText = '½ – ½'; winner = 'draw';  }
  }
  const wClass = winner === 'white' ? ' sb-winner' : '';
  const bClass = winner === 'black' ? ' sb-winner' : '';
  return `
    <div class="scoreboard-row">
      <div class="sb-player sb-white${wClass}">
        ${getAvatar(g.white, '40px')}
        <span class="player-link" data-player="${g.white}">${g.white}</span>
      </div>
      <div class="sb-score${result ? '' : ' sb-pending'}">${scoreText}</div>
      <div class="sb-player sb-black${bClass}">
        ${getAvatar(g.black, '40px')}
        <span class="player-link" data-player="${g.black}">${g.black}</span>
      </div>
    </div>`;
}

function gameCard(g, result, prob) {
  const url    = result?.GameURL || '';
  const gameId = url ? url.split('/').filter(Boolean).pop().split('?')[0].slice(0, 8) : '';
  const lichessFooter = url ? `
    <div class="lichess-footer">
      <div class="lichess-link-row">
        <a class="lichess-link" href="${url}" target="_blank" rel="noopener">View on Lichess &#x2197;</a>
        ${gameId ? `<button class="lichess-board-toggle" data-game-id="${gameId}">▸ Board</button>` : ''}
      </div>
      ${gameId ? `<div class="lichess-embed" id="embed-${gameId}" style="display:none">
        <iframe src="https://lichess.org/embed/game/${gameId}?theme=auto&bg=dark"
                width="100%" height="400" frameborder="0" allowtransparency="true"></iframe>
      </div>` : ''}
    </div>` : '';
  return `
    <div class="game-card ${result ? 'played' : 'pending'}">
      <div class="card-header">
        <span class="card-meta">Round ${g.round}${g.date ? ' · ' + fmtDate(g.date) : ''}</span>
        <span class="card-chevron">▾</span>
      </div>
      <div class="card-summary">${cardSummary(g, result)}</div>
      <div class="card-body">
        ${scoreboardRow(g, result)}
        ${probBar(prob, g.white, g.black, g.expected)}
        ${lichessFooter}
      </div>
    </div>`;
}


// ── RENDER SCHEDULE ───────────────────────────────────────────────────────────
function renderSchedule(sA, sB, resultsMap, statsMap) {
  const { monday, sunday } = weekBounds();

  function pickGames(games) {
    const thisWeek = games.filter(g => g.date && g.date >= monday && g.date <= sunday);
    if (thisWeek.length) {
      return { games: thisWeek, ctx: `Round ${thisWeek[0].round}` };
    }

    const future = games.filter(g => g.date && g.date > sunday).sort((a,b) => a.date - b.date);
    if (future.length) {
      const nextRound = future[0].round;
      const nextGames = future.filter(g => g.round === nextRound);
      return { games: nextGames, ctx: `Week Off · Up Next: Round ${nextRound}` };
    }

    const past = games.filter(g => g.date && g.date < monday).sort((a,b) => b.date - a.date);
    if (past.length) {
      const lastRound = past[0].round;
      return { games: past.filter(g => g.round === lastRound), ctx: `Round ${lastRound}` };
    }

    return { games: [], ctx: 'Schedule' };
  }

  function buildCards(games) {
    if (!games.length) return '<div class="no-games">No games found for this period</div>';
    return games.map(g => {
      const result = lookupResult(resultsMap, g.white, g.black);
      const wR     = getRating(statsMap, g.white);
      const bR     = getRating(statsMap, g.black);
      return gameCard(g, result, eloProb(wR, bR));
    }).join('');
  }

  const { games: premGames, ctx: premCtx } = pickGames(sA);
  const { games: champGames, ctx: champCtx } = pickGames(sB);

  const premBye  = premGames.find(g => g.bye)?.bye  || null;
  const champBye = champGames.find(g => g.bye)?.bye || null;

  document.getElementById('tab-schedule').innerHTML = `
    <div class="week-banner">
      <strong>&#x1f4c5; ${fmtDateRange(monday, sunday)}</strong>
    </div>

    <label class="toggle-row">
      <input type="checkbox" id="probToggle">
      <span class="toggle-label">Show Expected Wins</span>
    </label>

    <div class="section-header" id="hdr-prem">
      <span class="section-title">♛ Premiership</span>
      <div class="section-line"></div>
      <span class="section-chevron" id="chev-prem">${sectionState.prem ? '▾' : '▸'}</span>
    </div>
    <div class="section-body${sectionState.prem ? '' : ' collapsed'}" id="body-prem">
      <div class="round-context-row">
        <div class="round-context">${premCtx}</div>
        ${premBye ? `<span class="bye-note">Bye: ${premBye}</span>` : ''}
      </div>
      ${buildCards(premGames)}
    </div>

    <div class="section-header" id="hdr-champ" style="margin-top:24px">
      <span class="section-title">♜ Championship</span>
      <div class="section-line"></div>
      <span class="section-chevron" id="chev-champ">${sectionState.champ ? '▾' : '▸'}</span>
    </div>
    <div class="section-body${sectionState.champ ? '' : ' collapsed'}" id="body-champ">
      <div class="round-context-row">
        <div class="round-context">${champCtx}</div>
        ${champBye ? `<span class="bye-note">Bye: ${champBye}</span>` : ''}
      </div>
      ${buildCards(champGames)}
    </div>
  `;

  document.getElementById('probToggle').addEventListener('change', e => {
    document.getElementById('tab-schedule').classList.toggle('probs-on', e.target.checked);
  });

  // Collapsible section headers
  ['prem', 'champ'].forEach(key => {
    document.getElementById('hdr-' + key).addEventListener('click', () => {
      sectionState[key] = !sectionState[key];
      document.getElementById('body-' + key).classList.toggle('collapsed', !sectionState[key]);
      document.getElementById('chev-' + key).textContent = sectionState[key] ? '▾' : '▸';
    });
  });

  // Collapsible game cards + Lichess board toggle (delegated — works after re-renders)
  document.getElementById('tab-schedule').addEventListener('click', e => {
    // Board embed toggle
    const btn = e.target.closest('.lichess-board-toggle');
    if (btn) {
      const embed  = document.getElementById('embed-' + btn.dataset.gameId);
      const shown  = embed.style.display !== 'none';
      embed.style.display = shown ? 'none' : 'block';
      btn.textContent = shown ? '▸ Board' : '▾ Board';
      return;
    }
    // Card collapse toggle
    const hdr = e.target.closest('.card-header');
    if (!hdr) return;
    const card = hdr.closest('.game-card');
    if (!card) return;
    const collapsed = card.classList.toggle('collapsed');
    hdr.querySelector('.card-chevron').textContent = collapsed ? '▸' : '▾';
  });
}

// ── JUST FOR FUN AWARDS ───────────────────────────────────────────────────────
function buildFunStatsHtml(statsMap, resultsMap) {
  const awards = [];
  const players = Object.values(statsMap).filter(p => parseInt(p.Games) >= 1);


  // 1. Least Blunders
  const withBlunders = players
    .filter(p => {
      const val = parseFloat(p['Avg Blunders']);
      return !isNaN(val) && p['Avg Blunders'] !== '';
    })
    .sort((a, b) => parseFloat(a['Avg Blunders']) - parseFloat(b['Avg Blunders']));

  if (withBlunders.length > 0) {
    const p = withBlunders[0];
    const blunderCount = parseFloat(p['Avg Blunders']).toFixed(1);
    awards.push({
      icon: '&#x1f9d8;',
      title: 'Least Blunders',
      winner: p.Player,
      stat: `Average ${blunderCount} blunder${blunderCount === '1' ? '' : 's'} per game`,
    });
  }

  // Shared time formatter: seconds → "3m 42s" or "48s"
  function fmtClock(secs) {
    if (!secs || secs <= 0) return '0s';
    const m = Math.floor(secs / 60);
    const s = Math.round(secs % 60);
    return m > 0 ? `${m}m ${s.toString().padStart(2, '0')}s` : `${s}s`;
  }

  // 2. Think Time
  function parseTimeToSeconds(str) {
    if (!str || typeof str !== 'string') return parseFloat(str) || 0;
    if (str.includes(':')) {
      const parts = str.split(':');
      return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
    }
    return parseFloat(str) || 0;
  }

  const withThink = players.map(p => {
    const wt = parseTimeToSeconds(p['Avg Think/Move (W)']);
    const bt = parseTimeToSeconds(p['Avg Think/Move (B)']);
    const vals = [wt, bt].filter(v => v > 0);
    if (!vals.length) return null;
    return { p, avg: vals.reduce((a, b) => a + b, 0) / vals.length };
  }).filter(Boolean).sort((a, b) => b.avg - a.avg);

  if (withThink.length > 0) {
    const most = withThink[0];
    const least = withThink[withThink.length - 1];
    const mostTime = most.avg.toFixed(1);
    const leastTime = least.avg.toFixed(1);
    awards.push({ icon: '&#x1f914;', title: 'Most Thinky', winner: most.p.Player, stat: `Average ${mostTime} sec per move thinking time` });
    awards.push({ icon: '&#x2764;&#xfe0f;&#x200d;&#x1f525;', title: 'Plays from the Heart', winner: least.p.Player, stat: `Average ${leastTime} sec per move thinking time` });
  }

  // 3. David & Goliath (Requires results to be present)
  // This looks for the biggest upset based on Elo/Seed
  // If only one division has results, it will only look there.
  // ── David & Goliath: winner with the largest rating disadvantage ─────────────
  let davidGame = null;
  let maxDiff = 0;
  for (const games of Object.values(resultsMap)) {
    for (const g of games) {
      if (!g.Result || g.Result === '½-½' || g.Result === '1/2-1/2') continue;
      const winner = g.Result === '1-0' ? g.White : g.Black;
      const loser  = g.Result === '1-0' ? g.Black : g.White;
      // Prefer per-game ratings from Results (more accurate); fall back to current Elo from Player Stats
      const wRgame = parseFloat(g.Result === '1-0' ? g['White Rating'] : g['Black Rating']);
      const lRgame = parseFloat(g.Result === '1-0' ? g['Black Rating'] : g['White Rating']);
      const wR = (!isNaN(wRgame) && wRgame > 0) ? wRgame : getRating(statsMap, winner);
      const lR = (!isNaN(lRgame) && lRgame > 0) ? lRgame : getRating(statsMap, loser);
      if (!wR || !lR || isNaN(wR) || isNaN(lR)) continue;
      const diff = lR - wR; // positive = winner was the underdog
      if (diff > maxDiff) {
        maxDiff = diff;
        davidGame = {
          winner, loser,
          winnerRating: Math.round(wR),
          loserRating:  Math.round(lR),
          diff:         Math.round(diff),
        };
      }
    }
  }
  if (davidGame) {
    awards.push({
      icon: '&#x1faa8;',
      title: 'David & Goliath Award',
      winner: davidGame.winner,
      stat: `Beat ${davidGame.loser} despite being rated ${davidGame.diff} pts lower`
           + ` (${davidGame.winnerRating} vs ${davidGame.loserRating})`,
    });
  }

  // 4. Quickest & Longest game (by total clock time: White Think + Black Think)
  {
    let quickestGame = null, longestGame = null;
    let minTime = Infinity, maxTime = 0;

    for (const games of Object.values(resultsMap)) {
      for (const g of games) {
        if (!g.Result || !g.White || !g.Black) continue;
        const wt = parseTimeToSeconds(g['White Think']);
        const bt = parseTimeToSeconds(g['Black Think']);
        if (!wt || !bt) continue; // both sides' time must be present
        const total = wt + bt;
        if (total < minTime) { minTime = total; quickestGame = g; }
        if (total > maxTime) { maxTime = total; longestGame  = g; }
      }
    }

    if (quickestGame) {
      const wt = parseTimeToSeconds(quickestGame['White Think']);
      const bt = parseTimeToSeconds(quickestGame['Black Think']);
      awards.push({
        icon: '&#x26a1;',
        title: 'Speed Demons',
        winnerHtml: `<span class="player-link" data-player="${quickestGame.White}">${quickestGame.White}</span> vs <span class="player-link" data-player="${quickestGame.Black}">${quickestGame.Black}</span>`,
        stat: `Fastest Game: Total ${fmtClock(wt + bt)} (White: ${fmtClock(wt)}, Black: ${fmtClock(bt)})`,
      });
    }

    if (longestGame && maxTime !== minTime) {
      const wt = parseTimeToSeconds(longestGame['White Think']);
      const bt = parseTimeToSeconds(longestGame['Black Think']);
      awards.push({
        icon: '&#x23f3;',
        title: 'Marathon Match',
        winnerHtml: `<span class="player-link" data-player="${longestGame.White}">${longestGame.White}</span> vs <span class="player-link" data-player="${longestGame.Black}">${longestGame.Black}</span>`,
        stat: `Longest Game: Total ${fmtClock(wt + bt)} (White: ${fmtClock(wt)}, Black: ${fmtClock(bt)})`,
      });
    }
  }

  if (!awards.length) {
    return '<div class="no-games">Not enough data yet — check back once more games are played.</div>';
  }

  return awards.map(a => `
    <div class="award-card">
      <div class="award-icon">${a.icon}</div>
      <div class="award-info">
        <div class="award-title">${a.title}</div>
        <div class="award-winner">${a.winnerHtml !== undefined
            ? a.winnerHtml
            : `<span class="player-link" data-player="${a.winner}">${a.winner}</span>`}</div>
        <div class="award-stat">${a.stat}</div>
      </div>
    </div>`).join('');
}

// ── CROSSTABLE BUILDER ────────────────────────────────────────────────────────
function buildCrosstableHtml(players, resultsMap) {
  // players is already sorted by points descending
  const n = players.length;
  if (!n) return '<div class="no-games">No players yet</div>';

  const posClass = i => i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';

  // Column headers: numbered 1..n
  const colHeaders = players.map((_, i) => `<th>${i + 1}</th>`).join('');

  const rows = players.map((rowPlayer, ri) => {
    const posC = posClass(ri);

    const cells = players.map((colPlayer, ci) => {
      // Diagonal cell
      if (ri === ci) return `<td class="ct-cell ct-diag">—</td>`;

      // Look up the result between rowPlayer and colPlayer
      const key = [rowPlayer.Player, colPlayer.Player]
        .map(x => x.toLowerCase()).sort().join('|');
      const arr = resultsMap[key] || [];
      if (!arr.length) return `<td class="ct-cell ct-none">—</td>`;

      const match = arr[0];
      const rowIsWhite = match.White.toLowerCase() === rowPlayer.Player.toLowerCase();
      let outcome;
      if      (match.Result === '1-0') outcome = rowIsWhite ? 'win'  : 'loss';
      else if (match.Result === '0-1') outcome = rowIsWhite ? 'loss' : 'win';
      else                             outcome = 'draw';

      const cls  = outcome === 'win' ? 'ct-win' : outcome === 'loss' ? 'ct-loss' : 'ct-draw';
      const text = outcome === 'win' ? '1'       : outcome === 'loss' ? '0'        : '½';
      return `<td class="ct-cell ${cls}">${text}</td>`;
    }).join('');

    const pts = parseFloat(rowPlayer.Points) || 0;
    return `
      <tr>
        <td class="ct-pos-cell ${posC}">${ri + 1}</td>
        <td class="ct-player-cell"><span class="player-link" data-player="${rowPlayer.Player}">${rowPlayer.Player}</span></td>
        <td class="ct-pts-cell">${pts % 1 === 0 ? pts : pts}</td>
        ${cells}
      </tr>`;
  }).join('');

  return `
    <div class="crosstable-wrap">
      <table class="crosstable">
        <thead>
          <tr>
            <th>#</th>
            <th class="ct-player">Player</th>
            <th>Pts</th>
            ${colHeaders}
          </tr>
        </thead>
        <tbody>
          ${rows}
        </tbody>
      </table>
    </div>`;
}

function playerDetail(p, resultsMap) {
  const name   = p.Player;
  const league = p.League === 'A' ? '♛ Premiership' : '♜ Championship';
  const games  = parseInt(p.Games)  || 0;
  const wins   = parseInt(p.Wins)   || 0;
  const draws  = parseInt(p.Draws)  || 0;
  const losses = parseInt(p.Losses) || 0;
  const pts    = parseFloat(p.Points) || 0;

  const wPct = games ? (wins/games*100).toFixed(0) : 0;
  const dPct = games ? (draws/games*100).toFixed(0) : 0;
  const lPct = games ? (losses/games*100).toFixed(0) : 0;

  // Try to parse accuracy as number (may be "0.87" or "87%")
  function fmtAcc(raw) {
    if (!raw || raw === 'N/A' || raw === '') return '—';
    const n = parseFloat(raw);
    if (isNaN(n)) return raw;
    return n <= 1 ? `${(n*100).toFixed(0)}%` : `${n.toFixed(0)}%`;
  }

  function fmtNum(raw, dp=1) {
    if (!raw || raw === 'N/A' || raw === '') return '—';
    const n = parseFloat(raw);
    return isNaN(n) ? raw : n.toFixed(dp);
  }

  const acc      = fmtAcc(p['Avg Accuracy']);
  const acpl     = fmtNum(p['Avg ACPL (White)'] || p['Avg ACPL'], 0);
  const blunders = fmtNum(p['Avg Blunders']);
  const mistakes = fmtNum(p['Avg Mistakes']);

  const form    = recentForm(name, resultsMap);
  const dots    = Array.from({length:5}, (_,i) => {
    const r = form[i] || '_';
    return `<div class="fd ${r}"></div>`;
  }).join('');

  const openW = p['Fav Opening (W)'] || '';
  const openB = p['Fav Opening (B)'] || '';

  return `
    <div class="player-card">
      <div class="player-card-head">
        ${getAvatar(name, '48px')}
        <div>
          <div class="p-name">${name}</div>
          <div class="p-league">${league}</div>
        </div>
      </div>

      <div class="stat-grid">
        <div class="stat-box">
          <div class="stat-val">${pts}</div>
          <div class="stat-lbl">Points</div>
        </div>
        <div class="stat-box">
          <div class="stat-val">${games}</div>
          <div class="stat-lbl">Played</div>
        </div>
        <div class="stat-box">
          <div class="stat-val">${wPct}%</div>
          <div class="stat-lbl">Win Rate</div>
        </div>
      </div>

      <div class="wdl-section">
        <div class="wdl-bar">
          <div class="wdl-w" style="width:${wPct}%"></div>
          <div class="wdl-d" style="width:${dPct}%"></div>
          <div class="wdl-l" style="width:${lPct}%"></div>
        </div>
        <div class="wdl-legend">
          <span><span class="dot" style="background:var(--win)"></span>${wins} Won</span>
          <span><span class="dot" style="background:var(--draw)"></span>${draws} Drew</span>
          <span><span class="dot" style="background:var(--loss)"></span>${losses} Lost</span>
        </div>
      </div>

      <div class="stat-rows">
        ${form.length ? `
        <div class="srow">
          <span class="srow-lbl">Recent form</span>
          <div class="form-dots">${dots}</div>
        </div>` : ''}
        <div class="srow">
          <span class="srow-lbl">Avg accuracy</span>
          <span class="srow-val">${acc}</span>
        </div>
        <div class="srow">
          <span class="srow-lbl">Avg centipawn loss</span>
          <span class="srow-val">${acpl}</span>
        </div>
        <div class="srow">
          <span class="srow-lbl">Avg blunders / game</span>
          <span class="srow-val">${blunders}</span>
        </div>
        <div class="srow">
          <span class="srow-lbl">Avg mistakes / game</span>
          <span class="srow-val">${mistakes}</span>
        </div>
        ${openW ? `<div class="srow"><span class="srow-lbl">Fav opening (White)</span><span class="srow-val" style="font-size:.75rem;max-width:58%;text-align:right">${openW}</span></div>` : ''}
        ${openB ? `<div class="srow"><span class="srow-lbl">Fav opening (Black)</span><span class="srow-val" style="font-size:.75rem;max-width:58%;text-align:right">${openB}</span></div>` : ''}
      </div>
    </div>`;
}

// ── RENDER PAST ROUNDS ───────────────────────────────────────────────────────
function histGameRow(g, result, idPrefix = 'h') {
  let scoreText = 'Pending';
  let winner    = null; // 'white' | 'black' | 'draw'
  if (result) {
    if      (result.Result === '1-0') { scoreText = '1 – 0'; winner = 'white'; }
    else if (result.Result === '0-1') { scoreText = '0 – 1'; winner = 'black'; }
    else                              { scoreText = '½ – ½'; winner = 'draw';  }
  }

  const url    = result?.GameURL || '';
  const gameId = url ? url.split('/').filter(Boolean).pop().split('?')[0].slice(0, 8) : '';

  const lichessSection = url ? `
    <div class="hist-lichess-row">
      <a class="lichess-link" href="${url}" target="_blank" rel="noopener">View on Lichess &#x2197;</a>
      ${gameId ? `<button class="lichess-board-toggle" data-game-id="${idPrefix}${gameId}">▸ Board</button>` : ''}
    </div>
    ${gameId ? `<div class="lichess-embed" id="hembed-${idPrefix}${gameId}" style="display:none">
      <iframe src="https://lichess.org/embed/game/${gameId}?theme=auto&bg=dark"
              width="100%" height="400" frameborder="0" allowtransparency="true"></iframe>
    </div>` : ''}` : '';

  const wClass = winner === 'white' ? ' hg-winner' : '';
  const bClass = winner === 'black' ? ' hg-winner' : '';

  return `
    <div class="hist-game-row${url ? '' : ' no-expand'}">
      <div class="hist-game-summary">
        <div class="hg-scoreboard">
          <span class="hg-name hg-left${wClass}">
            <span class="player-link" data-player="${g.white}">${g.white}</span>
          </span>
          <span class="hg-score${result ? '' : ' hg-pending'}">${scoreText}</span>
          <span class="hg-name hg-right${bClass}">
            <span class="player-link" data-player="${g.black}">${g.black}</span>
          </span>
        </div>
        ${url ? '<span class="hist-game-chevron">▸</span>' : ''}
      </div>
      ${url ? `<div class="hist-game-detail hidden">${lichessSection}</div>` : ''}
    </div>`;
}

function renderHistory(gamesA, gamesB, resultsMap) {
  // Collect all unique round numbers across both leagues, sorted descending
  const allRounds = [...new Set([
    ...gamesA.map(g => g.round),
    ...gamesB.map(g => g.round),
  ])].filter(r => r !== null).sort((a, b) => b - a);

  let html = '';

  for (const round of allRounds) {
    const premGames  = gamesA.filter(g => g.round === round);
    const champGames = gamesB.filter(g => g.round === round);
    const allInRound = [...premGames, ...champGames];

    // Only show rounds where ALL non-bye games have a result (fully completed rounds)
    const nonByeGames = allInRound.filter(g => !g.bye);
    const allCompleted = nonByeGames.length > 0 && nonByeGames.every(g => lookupResult(resultsMap, g.white, g.black));
    if (!allCompleted) continue;

    // Get a representative date string for the round header
    const dates   = allInRound.map(g => g.date).filter(Boolean).sort((a, b) => a - b);
    const dateMeta = dates.length ? ` · ${fmtDate(dates[0])}` : '';

    // Count results for summary
    const played = allInRound.filter(g => lookupResult(resultsMap, g.white, g.black)).length;
    const total  = allInRound.filter(g => !g.bye).length;
    const countMeta = ` · ${played}/${total} played`;

    let roundContent = '';

    if (premGames.length) {
      roundContent += `<div class="hist-league-label">♛ Premiership</div>`;
      roundContent += premGames.map(g => histGameRow(g, lookupResult(resultsMap, g.white, g.black))).join('');
    }
    if (champGames.length) {
      roundContent += `<div class="hist-league-label">♜ Championship</div>`;
      roundContent += champGames.map(g => histGameRow(g, lookupResult(resultsMap, g.white, g.black))).join('');
    }

    html += `
      <div class="hist-round">
        <div class="hist-round-header">
          <span class="hist-round-title">Round ${round}<span class="hist-round-meta">${dateMeta}${countMeta}</span></span>
          <span class="hist-round-chevron">▾</span>
        </div>
        <div class="hist-round-body">
          ${roundContent}
        </div>
      </div>`;
  }

  if (!html) {
    html = '<div class="no-games">No completed rounds yet</div>';
  }

  document.getElementById('tab-history').innerHTML = `
    <div class="section-header">
      <span class="section-title">&#x1f4cb; Previous Rounds</span>
      <div class="section-line"></div>
    </div>
    ${html}`;

  // Delegated event handler for all interactions in this tab
  document.getElementById('tab-history').addEventListener('click', e => {
    // Lichess board toggle
    const boardBtn = e.target.closest('.lichess-board-toggle');
    if (boardBtn) {
      const embed = document.getElementById('hembed-' + boardBtn.dataset.gameId);
      if (embed) {
        const shown = embed.style.display !== 'none';
        embed.style.display = shown ? 'none' : 'block';
        boardBtn.textContent = shown ? '▸ Board' : '▾ Board';
      }
      return;
    }

    // Game row expand/collapse (click on summary row only)
    const summary = e.target.closest('.hist-game-summary');
    if (summary) {
      const row    = summary.closest('.hist-game-row');
      const detail = row.querySelector('.hist-game-detail');
      const chev   = summary.querySelector('.hist-game-chevron');
      const hidden = detail.classList.toggle('hidden');
      chev.textContent = hidden ? '▸' : '▾';
      return;
    }

    // Round header expand/collapse
    const rndHdr = e.target.closest('.hist-round-header');
    if (rndHdr) {
      const body = rndHdr.nextElementSibling;
      const chev = rndHdr.querySelector('.hist-round-chevron');
      const collapsed = body.classList.toggle('collapsed');
      chev.textContent = collapsed ? '▸' : '▾';
    }
  });
}

// ── RENDER CUP ────────────────────────────────────────────────────────────────
function renderCup(cupRaw, resultsMap) {
  // The cup sheet layout:
  // Header row contains: ROUND 1 (col 2), ROUND 2 (col 6), ROUND 3 (col 10), FINAL ROUND (col 14)
  // Data rows have player pairs at those column offsets, with 'vs' in between

  const ROUNDS = [
    { label: 'Round 1', p1: 2,  vs: 3,  p2: 4  },
    { label: 'Round 2', p1: 6,  vs: 7,  p2: 8  },
    { label: 'Round 3', p1: 10, vs: 11, p2: 12 },
    { label: 'Final',   p1: 14, vs: 15, p2: 16 },
  ];

  // Collect data rows (those containing 'vs')
  const dataRows = cupRaw.filter(r => r && r.some(c => c.trim().toLowerCase() === 'vs'));

  if (!dataRows.length) {
    document.getElementById('tab-cup').innerHTML = `
      <div class="section-header"><span class="section-title">&#x1f3c6; Louis Stewart Cup</span><div class="section-line"></div></div>
      <p class="cup-note">Cup fixtures will appear here as the season progresses.</p>
      <div class="no-games">No fixtures found</div>`;
    return;
  }

  let html = `
    <div class="section-header">
      <span class="section-title">&#x1f3c6; Louis Stewart Cup</span>
      <div class="section-line"></div>
    </div>
    <p class="cup-note">Cup games are played in the last week of every four rounds</p>`;

  for (const { label, p1: c1, vs: cv, p2: c2 } of ROUNDS) {
    const matches = dataRows
      .map(r => ({ p1: r[c1]?.trim()||'', p2: r[c2]?.trim()||'', vs: r[cv]?.trim()||'' }))
      .filter(m => m.vs.toLowerCase() === 'vs' && m.p1 && m.p2);

    if (!matches.length) continue;

    html += `<div class="cup-round-label">${label}</div>`;

    for (const { p1, p2 } of matches) {
      const isTBD  = p1 === 'TBD' || p2 === 'TBD';
      const result = (!isTBD) ? lookupResult(resultsMap, p1, p2, false) : null;
      html += `
        <div class="cup-card ${result ? 'played' : 'pending'}">
          ${scoreboardRow({ white: p1, black: p2 }, isTBD ? null : result)}
        </div>`;
    }
  }

  document.getElementById('tab-cup').innerHTML = html;
}

// ── RENDER TABLE ──────────────────────────────────────────────────────────────
function renderTable(statsMap) {
  const leagueA = [], leagueB = [];
  for (const p of Object.values(statsMap)) {
    if (p.League === 'A') leagueA.push(p);
    else if (p.League === 'B') leagueB.push(p);
  }

  const byPoints = arr => [...arr].sort((a, b) => parseFloat(b.Points || 0) - parseFloat(a.Points || 0));

  function tableHtml(players, leagueName) {
    const sorted = byPoints(players);
    if (!sorted.length) return '';

    const rows = sorted.map(p => `
      <tr>
        <td class="col-player"><span class="player-link" data-player="${p.Player}">${p.Player}</span></td>
        <td class="col-num">${parseInt(p.Games) || 0}</td>
        <td class="col-num">${parseInt(p.Wins) || 0}</td>
        <td class="col-num">${parseInt(p.Draws) || 0}</td>
        <td class="col-num">${parseInt(p.Losses) || 0}</td>
        <td class="col-num">${parseFloat(p.Points) || 0}</td>
      </tr>`).join('');

    return `
      <div class="table-section-header">${leagueName}</div>
      <table class="data-table">
        <thead>
          <tr>
            <th>Player</th>
            <th>Games</th>
            <th>Wins</th>
            <th>Draws</th>
            <th>Losses</th>
            <th>Points</th>
          </tr>
        </thead>
        <tbody>
          ${rows}
        </tbody>
      </table>`;
  }

  let html = '';
  if (leagueA.length) html += tableHtml(leagueA, '♛ Premiership');
  if (leagueB.length) html += tableHtml(leagueB, '♜ Championship');

  if (!html) {
    html = '<div class="no-games">No player data available</div>';
  }

  document.getElementById('tab-table').innerHTML = html;
}

// ── MODULE-LEVEL REFERENCES (populated during boot) ───────────────────────────
let _gamesA = [], _gamesB = [], _statsMap = {}, _resultsMap = {};
let _prevTab = 'schedule'; // tab to return to when closing player page

// ── PLAYER PAGE ───────────────────────────────────────────────────────────────
function getActiveTab() {
  for (const t of document.querySelectorAll('.tab-content')) {
    if (t.classList.contains('active')) return t.id.replace('tab-', '');
  }
  return 'schedule';
}

function showPlayerPage(name) {
  const pageEl = document.getElementById('player-page');

  // Only update the back-destination when navigating from a real tab (not player→player)
  if (!pageEl.classList.contains('active')) {
    _prevTab = getActiveTab();
  }

  const p = _statsMap[name.toLowerCase()];

  // Collect all of this player's completed games from resultsMap, newest first
  const nameLow = name.toLowerCase();
  const playerResults = [];
  for (const entries of Object.values(_resultsMap)) {
    for (const r of entries) {
      if ((r.White || '').toLowerCase() === nameLow ||
          (r.Black || '').toLowerCase() === nameLow) {
        playerResults.push(r);
      }
    }
  }
  playerResults.sort((a, b) => {
    const dA = parseDate(a.Date) || new Date(0);
    const dB = parseDate(b.Date) || new Date(0);
    return dB - dA;
  });

  // Build game history rows — use 'pp' prefix to avoid ID collisions with other tabs
  function getGameRound(white, black) {
    const wl = white.toLowerCase(), bl = black.toLowerCase();
    return [..._gamesA, ..._gamesB].find(g =>
      (g.white.toLowerCase() === wl && g.black.toLowerCase() === bl) ||
      (g.white.toLowerCase() === bl && g.black.toLowerCase() === wl)
    )?.round ?? null;
  }

  const gamesHtml = playerResults.length
    ? playerResults.map(r => {
        const round = getGameRound(r.White, r.Black);
        const g = { white: r.White, black: r.Black, round: round ?? '?',
                    date: parseDate(r.Date) };
        return histGameRow(g, r, 'pp');
      }).join('')
    : '<div class="no-games">No completed games yet</div>';

  const league = p ? (p.League === 'A' ? '♛ Premiership' : '♜ Championship') : '';

  pageEl.innerHTML = `
    <div class="player-page-header">
      <button id="playerBackBtn">← Back</button>
      <span class="player-page-title">${name}${league ? ' · ' + league : ''}</span>
    </div>
    <div class="player-page-body">
      ${p ? playerDetail(p, _resultsMap) : '<div class="no-games">No player data found</div>'}
      <div class="section-header">
        <span class="section-title">Game History</span>
        <div class="section-line"></div>
      </div>
      ${gamesHtml}
    </div>`;

  // Show player page, hide tab bar and tab contents
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelector('.tabs').style.display = 'none';
  pageEl.classList.add('active');
  window.scrollTo(0, 0);
}

function hidePlayerPage() {
  const pageEl = document.getElementById('player-page');
  pageEl.classList.remove('active');
  document.querySelector('.tabs').style.display = '';
  document.getElementById('tab-' + _prevTab).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === _prevTab);
  });
}

// ── GLOBAL CLICK DELEGATION ───────────────────────────────────────────────────
document.body.addEventListener('click', e => {
  // Back button in player page
  if (e.target.id === 'playerBackBtn') {
    hidePlayerPage();
    return;
  }

  // Player name links — navigate to player page
  const link = e.target.closest('.player-link');
  if (link && link.dataset.player) {
    e.stopPropagation(); // prevent row-expand handlers from firing
    showPlayerPage(link.dataset.player);
    return;
  }

  // Player page: Lichess board toggle
  if (e.target.closest('#player-page')) {
    const boardBtn = e.target.closest('.lichess-board-toggle');
    if (boardBtn) {
      const embed = document.getElementById('hembed-' + boardBtn.dataset.gameId);
      if (embed) {
        const shown = embed.style.display !== 'none';
        embed.style.display = shown ? 'none' : 'block';
        boardBtn.textContent = shown ? '▸ Board' : '▾ Board';
      }
      return;
    }
    // Player page: game row expand/collapse
    const summary = e.target.closest('.hist-game-summary');
    if (summary) {
      const row    = summary.closest('.hist-game-row');
      const detail = row.querySelector('.hist-game-detail');
      const chev   = summary.querySelector('.hist-game-chevron');
      const hidden = detail.classList.toggle('hidden');
      chev.textContent = hidden ? '▸' : '▾';
    }
  }
}, true); // capture phase so stopPropagation blocks tab-level handlers

// ── TAB SWITCHING ─────────────────────────────────────────────────────────────
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

// ── BOOT ──────────────────────────────────────────────────────────────────────
document.getElementById('loadTime').textContent =
  new Date().toLocaleTimeString('en-IE', { hour:'2-digit', minute:'2-digit' });

(async () => {
  try {
    const { sA, sB, res, ps, cup } = await loadAll();

    const gamesA     = parseSchedule(sA);
    const gamesB     = parseSchedule(sB);
    const resultsMap = parseResults(res);
    const statsMap   = parsePlayerStats(ps);
    enrichStatsWithResults(statsMap, resultsMap); // overwrite formula values with JS-computed stats

    // Store at module level so player page functions can access them
    _gamesA = gamesA;
    _gamesB = gamesB;
    _resultsMap = resultsMap;
    _statsMap = statsMap;

    renderSchedule(gamesA, gamesB, resultsMap, statsMap);
    renderStats(statsMap, resultsMap);
    renderTable(statsMap);
    renderCup(cup, resultsMap);
    renderHistory(gamesA, gamesB, resultsMap);

  } catch (err) {
    console.error(err);
    const msg = `<div class="error-msg"><p>&#x26a0;&#xfe0f; Could not load data</p><br><small>${err.message}</small></div>`;
    ['schedule','stats','cup','history'].forEach(t => {
      document.getElementById('tab-' + t).innerHTML = msg;
    });
  }
})();
</script>
</body>
</html>
